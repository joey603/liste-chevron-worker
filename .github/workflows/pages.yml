name: Publish web app

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Les commits « chore: release » poussés avec GITHUB_TOKEN
  # ne déclenchent pas de push workflow — republier après la release Windows.
  workflow_run:
    workflows:
      - Build & Release Windows
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Build authorized-list site
        working-directory: authorized-list-site
        env:
          # URL Apps Script …/exec (secret GitHub optionnel)
          VITE_API_URL: ${{ secrets.AUTHORIZED_LIST_API_URL }}
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/authorized
          cp -r dist/. ../dist/authorized/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
