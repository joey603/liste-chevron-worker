name: Build & Release Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, 'chore: release')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          VERSION="$(node scripts/bump-patch-version.js)"
          TAG="v${VERSION}"

          while git rev-parse "$TAG" >/dev/null 2>&1; do
            echo "Tag ${TAG} already exists, bumping again..."
            VERSION="$(node scripts/bump-patch-version.js)"
            TAG="v${VERSION}"
          done

          git add package.json package-lock.json
          git commit -m "chore: release ${VERSION}"
          git tag -a "$TAG" -m "chore: release ${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${TAG}"

      - name: Install dependencies
        run: npm ci

      - name: Push version commit and tag
        shell: bash
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build Windows installer and publish update files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx vite build && npx electron-builder --win --publish always

      - name: Upload installer (Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: liste-chevron-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
